<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fd#</title>
<style>
  :root { --bg:#14161a; --panel:#1c1f26; --text:#e6e6e6; --muted:#8b93a1; --accent:#f2b84b; --line:#2c303a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  h1 { margin: 0 0 .25rem; font-size: 1.6rem; }
  p.sub { margin: 0 0 1rem; color: var(--muted); }
  .bar { display:flex; gap:.5rem; align-items:center; margin: .75rem 0; flex-wrap: wrap; }
  button, select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: .5rem .9rem; font-size: 1rem; cursor: pointer; }
  button.run { background: var(--accent); color:#1a1a1a; border-color: var(--accent); font-weight: 600; }
  button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  textarea, pre { width:100%; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: .75rem; font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace; margin: 0; tab-size: 4; }
  textarea { height: 300px; resize: vertical; }
  pre { min-height: 110px; white-space: pre-wrap; }
  pre.err { color: #ff8a80; }
  small { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>fd#</h1>

  <div class="bar">
    <button class="run" onclick="run()">Run</button>
    <select id="examples" onchange="loadExample()" aria-label="Examples">
      <option value="">Load an example...</option>
      <option value="family">Family tree</option>
      <option value="math">Variables and math</option>
      <option value="multi">More than one answer</option>
    </select>
    <small>Ctrl+Enter runs. Tab indents.</small>
  </div>

  <textarea id="code" spellcheck="false"></textarea>
  <pre id="output">Output shows up here.</pre>
</main>

<script>
// ============================================================
//  EXAMPLES
// ============================================================
const EXAMPLES = {
family: `# facts
parent("alice", "bob")
parent("alice", "dana")
parent("bob", "carol")
parent("dana", "eve")

# rule: ?a is a grandparent of ?c if both lines are true
teach grandparent(?a, ?c):
    parent(?a, ?b)
    parent(?b, ?c)

wonder grandparent("alice", ?who)
`,
math: `# variables work like Python
x = 5
name = "alice"
total = x + 10
say total
say name

# recursion with math
fact_of(0, 1)

teach fact_of(?n, ?r):
    ?n > 0
    ?m = ?n - 1
    fact_of(?m, ?s)
    ?r = ?n * ?s

wonder fact_of(5, ?answer)
`,
multi: `parent("alice", "bob")
parent("alice", "dana")
parent("carl", "fay")

# who are alice's children?
wonder parent("alice", ?child)

# who are siblings?
teach sibling(?a, ?b):
    parent(?p, ?a)
    parent(?p, ?b)
    ?a != ?b

wonder sibling("bob", ?who)
`
};

// ============================================================
//  1. LEXER: text -> tokens (with INDENT / DEDENT like Python)
// ============================================================
function lex(src) {
  const toks = [];
  const stack = [0];
  const lines = src.split("\n");
  const fail = (msg, ln) => { throw new Error("line " + ln + ": " + msg); };

  for (let n = 0; n < lines.length; n++) {
    const ln = n + 1;
    const line = lines[n].replace(/\t/g, "    ").replace(/\r$/, "");
    let i = 0, indent = 0;
    while (line[i] === " ") { indent++; i++; }
    if (i >= line.length || line[i] === "#") continue;      // blank or comment-only

    if (indent > stack[stack.length - 1]) {
      stack.push(indent);
      toks.push({ t: "INDENT", line: ln });
    } else {
      while (indent < stack[stack.length - 1]) {
        stack.pop();
        toks.push({ t: "DEDENT", line: ln });
      }
      if (indent !== stack[stack.length - 1]) fail("indentation does not match an earlier line", ln);
    }

    while (i < line.length) {
      const c = line[i];
      const rest = line.slice(i);
      let m;
      if (c === " ") { i++; continue; }
      if (c === "#") break;
      if ((m = rest.match(/^[A-Za-z_]\w*/))) {
        toks.push({ t: "NAME", v: m[0], line: ln }); i += m[0].length;
      } else if ((m = rest.match(/^\?\w+/))) {
        toks.push({ t: "VAR", v: m[0].slice(1), line: ln }); i += m[0].length;
      } else if ((m = rest.match(/^\d+(\.\d+)?/))) {
        toks.push({ t: "NUMBER", v: parseFloat(m[0]), line: ln }); i += m[0].length;
      } else if (c === '"') {
        const end = line.indexOf('"', i + 1);
        if (end < 0) fail("this string is missing its closing quote", ln);
        toks.push({ t: "STRING", v: line.slice(i + 1, end), line: ln });
        i = end + 1;
      } else if ((m = rest.match(/^(==|!=|<=|>=)/))) {
        toks.push({ t: m[0], line: ln }); i += 2;
      } else if ("(),=+-*/<>:".includes(c)) {
        toks.push({ t: c, line: ln }); i++;
      } else {
        fail("I don't understand the character '" + c + "'", ln);
      }
    }
    toks.push({ t: "NEWLINE", line: ln });
  }
  while (stack.length > 1) { stack.pop(); toks.push({ t: "DEDENT", line: lines.length }); }
  toks.push({ t: "EOF", line: lines.length });
  return toks;
}

// ============================================================
//  2. PARSER: tokens -> statements
// ============================================================
function parse(toks) {
  let p = 0;
  const peek = (k = 0) => toks[Math.min(p + k, toks.length - 1)];
  const next = () => toks[p++];
  const fail = (msg, tok = peek()) => { throw new Error("line " + tok.line + ": " + msg); };
  const expect = (t, what) => {
    if (peek().t !== t) fail("expected " + (what || t) + " but found " + describe(peek()));
    return next();
  };
  const describe = tok => tok.t === "NEWLINE" ? "the end of the line" : tok.t === "EOF" ? "the end of the program"
    : tok.v !== undefined ? "'" + tok.v + "'" : "'" + tok.t + "'";

  // ----- expressions -----
  function parseExpr() {
    let left = parseMul();
    while (peek().t === "+" || peek().t === "-") {
      const op = next().t;
      left = { k: "bin", op, l: left, r: parseMul() };
    }
    return left;
  }
  function parseMul() {
    let left = parseUnary();
    while (peek().t === "*" || peek().t === "/") {
      const op = next().t;
      left = { k: "bin", op, l: left, r: parseUnary() };
    }
    return left;
  }
  function parseUnary() {
    if (peek().t === "-") { next(); return { k: "bin", op: "-", l: { k: "num", v: 0 }, r: parseUnary() }; }
    return parsePrimary();
  }
  function parsePrimary() {
    const tok = next();
    switch (tok.t) {
      case "NUMBER": return { k: "num", v: tok.v };
      case "STRING": return { k: "str", v: tok.v };
      case "VAR": return { k: "var", n: tok.v };
      case "(": { const e = parseExpr(); expect(")"); return e; }
      case "NAME":
        if (peek().t === "(") {
          next();
          const args = [];
          if (peek().t !== ")") {
            args.push(parseExpr());
            while (peek().t === ",") { next(); args.push(parseExpr()); }
          }
          expect(")", "')' to close the list");
          return { k: "cmp", f: tok.v, args };
        }
        return { k: "name", n: tok.v };
      default: fail("I wasn't expecting " + describe(tok), tok);
    }
  }

  // ----- one line of a rule body -----
  function parseGoal() {
    const left = parseExpr();
    const ops = ["==", "!=", "<", ">", "<=", ">=", "="];
    if (ops.includes(peek().t)) {
      const op = next().t;
      return { k: "op", op, l: left, r: parseExpr() };
    }
    if (left.k !== "cmp") fail("this line should look like name(...) or a comparison like ?x > 3");
    return left;
  }

  // ----- statements -----
  const stmts = [];
  while (peek().t !== "EOF") {
    if (peek().t === "NEWLINE") { next(); continue; }
    const first = peek();
    const line = first.line;

    if (first.t === "NAME" && first.v === "teach" && peek(1).t === "NAME") {
      next();
      const head = parseExpr();
      if (head.k !== "cmp") fail("a rule needs a name and parentheses, like teach name(?a, ?b):", first);
      expect(":", "':' at the end of the rule line");
      expect("NEWLINE");
      if (peek().t !== "INDENT") fail("the lines of a rule must be indented under it");
      next();
      const body = [];
      while (peek().t !== "DEDENT" && peek().t !== "EOF") {
        if (peek().t === "NEWLINE") { next(); continue; }
        body.push(parseGoal());
        expect("NEWLINE");
      }
      if (peek().t === "DEDENT") next();
      stmts.push({ type: "rule", head, body, line });
    } else if (first.t === "NAME" && first.v === "wonder" && peek(1).t !== "=") {
      next();
      const goal = parseGoal();
      expect("NEWLINE");
      stmts.push({ type: "wonder", goal, line });
    } else if (first.t === "NAME" && first.v === "say" && peek(1).t !== "=" && peek(1).t !== "(") {
      next();
      const e = parseExpr();
      expect("NEWLINE");
      stmts.push({ type: "say", expr: e, line });
    } else if (first.t === "NAME" && peek(1).t === "=") {
      next(); next();
      const e = parseExpr();
      expect("NEWLINE");
      stmts.push({ type: "assign", name: first.v, expr: e, line });
    } else {
      const head = parseExpr();
      if (head.k !== "cmp") fail("I don't know what this line means. Facts look like name(\"a\", \"b\")", first);
      expect("NEWLINE");
      stmts.push({ type: "fact", head, line });
    }
  }
  return stmts;
}

// ============================================================
//  3. SOLVER: unification + backtracking
// ============================================================
let VAR_ID = 0;
class Var { constructor(n) { this.n = n; this.id = ++VAR_ID; } }

let db = [];        // facts and rules
let globals = {};   // x = 5 style variables

// Turn parsed syntax into live values, giving each ?variable a fresh Var
function rename(a, m) {
  switch (a.k) {
    case "num": case "str": return a.v;
    case "var":
      if (a.n === "_") return new Var("_");
      return m[a.n] || (m[a.n] = new Var(a.n));
    case "name": return a.n in globals ? globals[a.n] : a.n;
    case "cmp": return { f: a.f, args: a.args.map(x => rename(x, m)) };
    case "bin": return { bin: true, op: a.op, l: rename(a.l, m), r: rename(a.r, m) };
  }
}
function renameGoal(g, m) {
  if (g.k === "op") return { g: "op", op: g.op, l: rename(g.l, m), r: rename(g.r, m) };
  return { g: "call", f: g.f, args: g.args.map(x => rename(x, m)) };
}

function walk(t, s) {
  while (t instanceof Var && s[t.id] !== undefined) t = s[t.id];
  return t;
}

// Evaluate math. Returns undefined if some variable is still unknown.
function ev(t, s) {
  t = walk(t, s);
  if (t instanceof Var) return undefined;
  if (t && t.bin) {
    const a = ev(t.l, s), b = ev(t.r, s);
    if (a === undefined || b === undefined) return undefined;
    if (t.op === "+") return a + b;
    if (typeof a !== "number" || typeof b !== "number") throw new Error("you can only use " + t.op + " on numbers");
    if (t.op === "-") return a - b;
    if (t.op === "*") return a * b;
    if (t.op === "/") { if (b === 0) throw new Error("divided by zero"); return a / b; }
  }
  return t;
}

function unify(a, b, s) {
  a = walk(a, s); b = walk(b, s);
  if (a && a.bin) { a = ev(a, s); if (a === undefined) throw new Error("math on a value that isn't known yet"); }
  if (b && b.bin) { b = ev(b, s); if (b === undefined) throw new Error("math on a value that isn't known yet"); }
  if (a instanceof Var) return a === b ? s : { ...s, [a.id]: b };
  if (b instanceof Var) return { ...s, [b.id]: a };
  if (a && b && typeof a === "object" && typeof b === "object") {
    if (a.f !== b.f || a.args.length !== b.args.length) return null;
    for (let i = 0; i < a.args.length; i++) { s = unify(a.args[i], b.args[i], s); if (!s) return null; }
    return s;
  }
  return a === b ? s : null;
}

function doEquals(g, s) {          // ?x = something
  const lv = ev(g.l, s), rv = ev(g.r, s);
  if (lv !== undefined && rv !== undefined) return unify(lv, rv, s);
  if (rv !== undefined) return unify(g.l, rv, s);
  if (lv !== undefined) return unify(g.r, lv, s);
  return unify(g.l, g.r, s);
}

function doCompare(g, s) {         // ==  !=  <  >  <=  >=
  const a = ev(g.l, s), b = ev(g.r, s);
  if (a === undefined || b === undefined) throw new Error("a comparison needs both sides to be known");
  switch (g.op) {
    case "==": return unify(a, b, s) !== null;
    case "!=": return unify(a, b, s) === null;
    case "<": return a < b;
    case ">": return a > b;
    case "<=": return a <= b;
    case ">=": return a >= b;
  }
}

function* solve(goals, s, ctx) {
  if (goals.length === 0) { yield s; return; }
  if (++ctx.steps > 200000) throw new Error("too many steps. Is there a rule that loops forever?");
  const [g, ...rest] = goals;

  if (g.g === "op") {
    if (g.op === "=") { const s2 = doEquals(g, s); if (s2) yield* solve(rest, s2, ctx); }
    else if (doCompare(g, s)) yield* solve(rest, s, ctx);
    return;
  }

  if (!db.some(c => c.head.f === g.f)) throw new Error('nothing has been taught about "' + g.f + '". Check the spelling.');
  for (const c of db) {
    if (c.head.f !== g.f || c.head.args.length !== g.args.length) continue;
    const m = {};
    const head = rename(c.head, m);
    const body = c.body.map(x => renameGoal(x, m));
    let s2 = s;
    for (let i = 0; i < g.args.length && s2; i++) s2 = unify(g.args[i], head.args[i], s2);
    if (s2) yield* solve([...body, ...rest], s2, ctx);
  }
}

// ============================================================
//  4. RUNNING A PROGRAM
// ============================================================
function show(t, s) {
  t = walk(t, s);
  if (t && t.bin) { const v = ev(t, s); return v === undefined ? "?" : show(v, s); }
  if (t instanceof Var) return "?" + t.n;
  if (typeof t === "string") return JSON.stringify(t);
  if (t && typeof t === "object") return t.f + "(" + t.args.map(x => show(x, s)).join(", ") + ")";
  return String(t);
}

function interpret(src) {
  db = []; globals = {};
  const out = [];
  const stmts = parse(lex(src));

  for (const st of stmts) {
    try {
      if (st.type === "fact") {
        db.push({ head: st.head, body: [] });
      } else if (st.type === "rule") {
        db.push({ head: st.head, body: st.body });
      } else if (st.type === "assign") {
        const v = ev(rename(st.expr, {}), {});
        if (v === undefined) throw new Error("can't work out a value for " + st.name);
        globals[st.name] = v;
      } else if (st.type === "say") {
        const v = ev(rename(st.expr, {}), {});
        out.push(v === undefined ? "?" : show(v, {}));
      } else if (st.type === "wonder") {
        const m = {};
        const goal = renameGoal(st.goal, m);
        const names = Object.keys(m);
        let count = 0;
        for (const s of solve([goal], {}, { steps: 0 })) {
          count++;
          out.push(names.length ? names.map(n => "?" + n + " = " + show(m[n], s)).join(", ") : "yes");
          if (count >= 100) { out.push("(stopped after 100 answers)"); break; }
        }
        if (count === 0) out.push("no");
      }
    } catch (e) {
      if (/^line \d+:/.test(e.message)) throw e;
      throw new Error("line " + st.line + ": " + e.message);
    }
  }
  return out.length ? out.join("\n") : "(the program ran but didn't say or wonder anything)";
}

// ============================================================
//  5. THE IDE
// ============================================================
const codeBox = document.getElementById("code");
const outBox = document.getElementById("output");

function run() {
  try {
    outBox.className = "";
    outBox.textContent = interpret(codeBox.value);
  } catch (e) {
    outBox.className = "err";
    outBox.textContent = "Error " + e.message;
  }
}

function loadExample() {
  const sel = document.getElementById("examples");
  if (EXAMPLES[sel.value]) { codeBox.value = EXAMPLES[sel.value]; run(); }
  sel.value = "";
}

codeBox.addEventListener("keydown", e => {
  if (e.key === "Tab") {
    e.preventDefault();
    const a = codeBox.selectionStart, b = codeBox.selectionEnd;
    codeBox.value = codeBox.value.slice(0, a) + "    " + codeBox.value.slice(b);
    codeBox.selectionStart = codeBox.selectionEnd = a + 4;
  } else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
    e.preventDefault(); run();
  }
});

codeBox.value = EXAMPLES.family;
run();
</script>
</body>
</html>
